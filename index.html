<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Stories by Rosie — Family Photography</title>

  <!-- Free look-alike fonts: Jost (modern geometric, like Harlow's Atype)
       and Cormorant Garamond (elegant italic accents). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Jost:wght@300;400;500&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ============ NAVIGATION ============ -->
  <!-- A solid dark bar with links split around a centered monogram, like Harlow.
       Each link is its own page now (About/Portfolio/Info/Contact/Book), not an
       anchor scroll — this same nav block is repeated on every page. -->
  <header class="nav">
    <nav class="nav-group">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
    </nav>
    <a href="index.html" class="monogram"><img src="images/logo/botanical-r.png" alt="Little Stories by Rosie"></a>
    <nav class="nav-group">
      <a href="info.html">Info</a>
      <a href="contact.html">Contact</a>
      <a href="book.html">Book</a>
    </nav>
  </header>

  <!-- ============ HERO ============ -->
  <!-- Like Harlow: the brand name over a full photo. As you scroll, the text
       lifts away faster than the photo (a parallax effect, powered by script.js). -->
  <section class="hero">
    <div class="hero-bg">
      <div class="hero-slide is-active" style="background-image:url('images/general/DSC_3029.jpg')"></div>
      <div class="hero-slide" style="background-image:url('images/general/DSC_1488-Edit-2.jpg')"></div>
      <div class="hero-slide" style="background-image:url('images/families/DSC_1512-Edit-2.jpg')"></div>
    </div>
    <div class="hero-inner">
      <p class="hero-eyebrow">Little Stories by</p>
      <h1 class="hero-brand">Rosie</h1>
    </div>
    <p class="hero-tagline">Family Photographer<br>specializing in warm, unscripted stories</p>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <a href="index.html" class="brand">Little Stories <em>by Rosie</em></a>
    <p class="social">Follow along &middot; <a href="#">@littlestoriesbyrosie</a></p>
    <p class="credit">PHOTOS BY ROSIE &nbsp;|&nbsp; &copy; 2026 LITTLE STORIES BY ROSIE</p>
  </footer>

  <!-- This connects our JavaScript file, which powers the scroll animations
       and hero parallax/slideshow. It sits at the end so the page content
       loads first. -->
  <script src="script.js"></script>

</body>
</html>
